[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scenelive"
version = "0.2.0"
description = "Live object names and directions from a phone video stream: fast per-frame loop + periodic map loop. Replay simulator with per-stage timing."
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python"]

[project.optional-dependencies]
models = ["ultralytics"]
server = ["cryptography"]
agent = ["anthropic"]

[project.scripts]
scenelive = "scenelive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scenelive = ["server/web/*"]
